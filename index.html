<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nashville Date Wheel</title>
<style>
    body{position:relative;overflow-x:hidden;background:#1b0b14;color:#fff0f5}
    body:before{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(38,7,24,.88),rgba(111,34,67,.72));z-index:-1}
    .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:saturate(.8)}
    .card{background:rgba(255,248,251,.96);color:#351b28}
    .hero{background:rgba(91,22,52,.7)!important;color:white!important;text-align:center;padding:34px 20px!important}
    .hero h1{font-family:Georgia,serif;font-size:clamp(32px,8vw,58px);margin:0 0 10px}
    .hero p{font-size:16px;letter-spacing:.4px}
    .muted{opacity:.8}
    body{font-family:Arial;background:#fff5f8;color:#351b28;max-width:700px;margin:auto;padding:18px}.card{background:white;padding:20px;border-radius:18px;margin:12px 0;box-shadow:0 2px 12px #0001}button,input,select{padding:11px;border-radius:9px;border:1px solid #ddd;margin:5px 0;font:inherit}button{background:#963f61;color:white;border:0}input,select{width:100%;box-sizing:border-box}.wheel{width:180px;height:180px;border-radius:50%;background:conic-gradient(#783451,#d68aa7,#f0b5c8,#8f4767,#783451);display:grid;place-items:center;margin:20px auto;transition:transform 1s}.wheel b{background:white;color:#783451;padding:22px;border-radius:50%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.option{background:#fff0f5;color:#351b28;text-align:left}small{display:block;opacity:.7}.price{font-size:32px;font-weight:bold}</style></head><body>
<video class="bg-video" autoplay muted loop playsinline>
  <source src="date-night-background.mov" type="video/quicktime">
</video>
<div class="card hero"><h1>Our Date Night 💕</h1><p>Pick a moment. Make a memory.</p><p class="muted">Nashville date ideas made just for us</p></div>
<div class="card"><h2>Who's planning?</h2><input id="name" placeholder="Your name"><input id="date" type="date"><select id="time"><option>Choose time</option><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Late night</option></select></div>
<div class="card"><h2>Spin the wheel 🎡</h2><div class="wheel" id="wheel"><b>SPIN</b></div><button onclick="spin()">Spin the wheel</button><h2 id="result">Ready for a date?</h2><p id="desc">Choose an activity.</p><div class="grid" id="options"></div></div>
<div class="card"><h2>Payment preference</h2><button onclick="pay='him';update()">He pays 💳</button><button onclick="pay='none';update()">No date 🚫</button><h3>Total</h3><div class="price" id="total">$0.00</div><button onclick="requestDate()">Request this date</button><p id="message"></p></div>
<div class="card"><h2>Private activity editor</h2><p>Edit prices and names. Changes remain in this browser.</p><div id="admin"></div></div>
<script>
let activities=[{"name": "Walk the John Seigenthaler Pedestrian Bridge", "price": 20}, {"name": "Picnic at Centennial Park", "price": 30}, {"name": "Visit the Nashville Farmers\u2019 Market", "price": 40}, {"name": "Walk Bicentennial Capitol Mall", "price": 50}, {"name": "Explore Nashville Public Library", "price": 60}, {"name": "Take photos at the WhatLiftsYou Wings mural", "price": 70}, {"name": "Explore 12 South", "price": 80}, {"name": "Walk Hillsboro Village", "price": 90}, {"name": "Nashville Greenway walk", "price": 20}, {"name": "Shelby Bottoms Greenway", "price": 30}, {"name": "Sunset at Cumberland Park", "price": 40}, {"name": "Picnic at Shelby Park", "price": 50}, {"name": "Explore Germantown", "price": 60}, {"name": "Explore Five Points in East Nashville", "price": 70}, {"name": "Downtown photo walk", "price": 80}, {"name": "Sunset at Love Circle", "price": 90}, {"name": "Vanderbilt area walk", "price": 20}, {"name": "Farmers\u2019 Market dessert stop", "price": 30}, {"name": "Coffee and walk in 12 South", "price": 40}, {"name": "Night walk on the pedestrian bridge", "price": 50}, {"name": "Game Terminal arcade", "price": 60}, {"name": "Puttshack Nashville", "price": 70}, {"name": "Pins Mechanical Co. bowling", "price": 80}, {"name": "Up-Down Nashville arcade", "price": 90}, {"name": "Dave & Buster\u2019s at Opry Mills", "price": 20}, {"name": "Play Playground", "price": 30}, {"name": "PopStroke Antioch", "price": 40}, {"name": "Indoor mini golf", "price": 50}, {"name": "Dinkville Under Broad", "price": 60}, {"name": "Brooklyn Bowl bowling", "price": 70}, {"name": "Escape room", "price": 80}, {"name": "Trivia night", "price": 90}, {"name": "Karaoke night", "price": 20}, {"name": "Board game night", "price": 30}, {"name": "Pool hall date", "price": 40}, {"name": "Go-kart racing", "price": 50}, {"name": "Axe throwing", "price": 60}, {"name": "Indoor rock climbing", "price": 70}, {"name": "Trampoline park", "price": 80}, {"name": "Laser tag", "price": 90}, {"name": "Arcade and pizza", "price": 20}, {"name": "National Museum of African American Music", "price": 30}, {"name": "Frist Art Museum", "price": 40}, {"name": "Country Music Hall of Fame", "price": 50}, {"name": "Ryman Auditorium tour", "price": 60}, {"name": "Tennessee State Museum", "price": 70}, {"name": "The Parthenon", "price": 80}, {"name": "Adventure Science Center", "price": 90}, {"name": "Cheekwood Gardens", "price": 20}, {"name": "Andrew Jackson\u2019s Hermitage", "price": 30}, {"name": "Lane Motor Museum", "price": 40}, {"name": "Belmont Mansion", "price": 50}, {"name": "Hatch Show Print", "price": 60}, {"name": "Farmers\u2019 Market food crawl", "price": 70}, {"name": "The Pharmacy Burger Parlor", "price": 80}, {"name": "Jeni\u2019s ice cream in Hillsboro Village", "price": 90}, {"name": "Frothy Monkey coffee", "price": 20}, {"name": "Barista Parlor coffee", "price": 30}, {"name": "Five Daughters Bakery", "price": 40}, {"name": "Rolf and Daughters dinner", "price": 50}, {"name": "Lockeland Table dinner", "price": 60}, {"name": "The Hampton Social dinner", "price": 70}, {"name": "Chauhan Ale and Masala House", "price": 80}, {"name": "Hattie B\u2019s hot chicken", "price": 90}, {"name": "Monell\u2019s Southern meal", "price": 20}, {"name": "Biscuit Love brunch", "price": 30}, {"name": "Pinewood Social", "price": 40}, {"name": "Nectar: Urban Cantina", "price": 50}, {"name": "Edley\u2019s Bar-B-Que", "price": 60}, {"name": "Slim & Husky\u2019s pizza", "price": 70}, {"name": "Martin\u2019s Bar-B-Que Joint", "price": 80}, {"name": "Assembly Food Hall", "price": 90}, {"name": "Food tour downtown", "price": 20}, {"name": "Dessert crawl", "price": 30}, {"name": "Brunch at Milk & Honey", "price": 40}, {"name": "Dinner in East Nashville", "price": 50}, {"name": "Coffee shop hop", "price": 60}, {"name": "Live music on Broadway", "price": 70}, {"name": "R&B night at a local venue", "price": 80}, {"name": "Jazz night", "price": 90}, {"name": "Open mic night", "price": 20}, {"name": "Comedy show", "price": 30}, {"name": "Songwriters\u2019 round", "price": 40}, {"name": "Dancehall night", "price": 50}, {"name": "Karaoke and late-night food", "price": 60}, {"name": "Nashville SC match", "price": 70}, {"name": "Nashville Sounds game", "price": 80}, {"name": "Predators game", "price": 90}, {"name": "Movie at Regal Green Hills", "price": 20}, {"name": "Drive-in movie night", "price": 30}, {"name": "Thrift shopping in East Nashville", "price": 40}, {"name": "Bookstore date", "price": 50}, {"name": "Pottery painting", "price": 60}, {"name": "Paint-and-sip class", "price": 70}, {"name": "Cooking class", "price": 80}, {"name": "Candle-making class", "price": 90}, {"name": "Couples\u2019 massage", "price": 20}, {"name": "Hotel rooftop mocktail date", "price": 30}, {"name": "River cruise", "price": 40}, {"name": "Rent bikes downtown", "price": 50}];let selected=-1;let pay='';let rotation=0;
const $=x=>document.getElementById(x),money=x=>'$'+Number(x).toFixed(2);
function render(){ $('options').innerHTML=activities.map((a,i)=>'<button class="option" onclick="choose('+i+')">'+a.name+'<small>'+money(a.price)+'</small></button>').join(''); $('admin').innerHTML=activities.map((a,i)=>'<div><b>'+(i+1)+'. </b><input value="'+a.name.replace(/"/g,'&quot;')+'" onchange="activities['+i+'].name=this.value"><input type="number" value="'+a.price+'" onchange="activities['+i+'].price=+this.value;update()"></div>').join(''); }
function choose(i){selected=i;$('result').textContent=activities[i].name;$('desc').textContent='Estimated cost: '+money(activities[i].price);update();}
function spin(){let i=Math.floor(Math.random()*activities.length);rotation+=720+Math.random()*360;$('wheel').style.transform='rotate('+rotation+'deg)';choose(i);}
function update(){$('total').textContent=selected<0?'$0.00':money(activities[selected].price);render();}
function requestDate(){if(!$('name').value.trim())return $('message').textContent='Please enter your name.';if(selected<0)return $('message').textContent='Please select an activity.';if(!pay)return $('message').textContent='Choose He pays or No date.';$('message').textContent=pay==='none'?'No date selected.':'Request prepared for '+$('name').value+' for '+activities[selected].name+'.';}
render();
</script></body></html>
